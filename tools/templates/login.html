<div id="firebaseLogin">
 <section class="rf-login-card" aria-labelledby="rfLoginTitle">
  <img class="rf-login-logo" src="https://res.cloudinary.com/dgu2kmk8y/image/upload/v1793440407/LOGO.png" alt="Rocketfix">
  <div class="rf-login-heading"><span>ADMIN POS</span><h1 id="rfLoginTitle">Welcome back.</h1><p>Sign in to your Rocketfix360 account.</p></div>
  <form id="firebaseLoginForm" onsubmit="event.preventDefault()">
   <label for="loginEmail">Employee email</label><input id="loginEmail" type="email" maxlength="200" autocomplete="username" placeholder="you@example.com" required>
   <label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required>
   <button type="submit" id="loginSubmit">Sign in <span aria-hidden="true">→</span></button>
  </form>
  <p id="loginError" role="alert"></p><p id="loginStatus" role="status" aria-live="polite"></p>
  <div class="rf-login-footer">Rocketfix360 <span>•</span> Admin POS</div>
 </section>
</div>
